# Runs on every push / PR: validates everything that will run on the server before it gets there.
name: CI
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck (deploy, rollback, backup scripts)
        run: shellcheck -S warning scripts/*.sh backup/*.sh

      - name: docker compose config is valid
        run: cp .env.example .env && docker compose config --quiet

      - name: Dockerfile lint (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Nginx config syntax
        run: docker run --rm -v "$PWD/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine nginx -t
